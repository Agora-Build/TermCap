name: Codex Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  codex-review:
    # Trusted-author gate: the model gets OPENAI_API_KEY in env and its output is
    # posted verbatim, so untrusted PR text could try to exfiltrate secrets via
    # the review comment. Restrict to authors with push access — they already
    # have repo-secret access, so this adds no exposure; fork/untrusted PRs don't
    # run. (Mirrors claude-code-review.yml.)
    if: >-
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    # Backstop only, and a weak one: timeout-minutes does NOT apply to a step
    # that `uses:` a composite action, so this must sit at JOB level to bite at
    # all. Caps a hang at 10 min instead of GitHub's 60.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD --stat)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Codex Code Review
        id: run_codex
        # PINNED to v1.11. The floating `@v1` tag moved to v1.12, which rewrote
        # the privilege-isolation launch path (dropSudo / runCodexExec /
        # linuxCredentials). It spawns the CLI with INHERITED stdio and waits on
        # the child's `close` event, so any descendant that outlives the turn
        # keeps those descriptors open and the action never returns: Codex prints
        # its final message and token count, then the step emits no
        # `##[end-action]` and idles until the job is killed. Upstream
        # openai/codex-action#150 and #169; the wrapper fix (private pipes,
        # complete on `exit`) is proposed in their #151.
        #
        # It is workload-sensitive, not deterministic, so a green run does not
        # clear v1.12. Upstream's controlled data is what indicts the version:
        # 145/145 clean on v1.11 vs 69/74 on v1.12, model and effort held fixed.
        #
        # Revisit when #151 (or equivalent) ships in a v1.13+.
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # OPENAI_BASE_URL secret has no trailing slash, e.g. https://host/openai
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}/v1/responses
          model: gpt-5.6-sol
          sandbox: read-only
          prompt: |
            You are a senior code reviewer. Review the changes in PR #${{ github.event.pull_request.number }}.

            PR Title: ${{ github.event.pull_request.title }}
            PR Description: ${{ github.event.pull_request.body }}

            Changed files:
            ${{ steps.diff.outputs.diff }}

            Focus on:
            1. Security issues (injection, auth bypass, credential exposure)
            2. Logic errors and edge cases
            3. Performance concerns
            4. Code quality and maintainability

            This project captures terminal scrollback. Pay particular attention to
            scrollback coordinate arithmetic in src/backend/tmux.rs (absolute vs
            pane-relative confusion silently returns the wrong text), the shell
            hooks in shell/ (`$?` must be read first in precmd; command text must
            reach the binary as one argv element), and anything that could leak
            captured terminal contents, which may contain secrets.

            Be concise. Only comment on real issues, not style preferences.
            If the code looks good, say so briefly.

      - name: Post Review Comment
        if: steps.run_codex.outputs.final-message != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🤖 Codex Code Review\n\n${process.env.REVIEW_BODY}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          REVIEW_BODY: ${{ steps.run_codex.outputs.final-message }}
