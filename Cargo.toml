[package]
name = "tcap"
version = "0.1.1"
edition = "2021"
description = "Capture the last command and its output from your terminal"
license = "MIT"

[[bin]]
name = "tcap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
